---
layout: default
---
<article class="page">
  {% if page.title and page.show_title != false %}
  <header class="page-header">
    <h1 class="page-title">{{ page.title }}</h1>
    {% if page.description %}<p class="page-desc">{{ page.description }}</p>{% endif %}
  </header>
  {% endif %}
  {{ content }}
</article>
